<svg xmlns="http://www.w3.org/2000/svg" width="700" height="520" viewBox="0 0 700 520" style="font-family: Arial, sans-serif; font-size: 12px;">
  <rect width="700" height="520" fill="#f8fafc"/>
  <text x="350" y="24" text-anchor="middle" font-size="16" font-weight="bold">Flowchart Alur MVC - Tambah Produk</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="250" y="40" width="200" height="40" fill="#dbeafe" stroke="#2563eb" rx="20"/>
  <text x="350" y="65" text-anchor="middle">User tekan Submit (form)</text>
  <line x1="350" y1="80" x2="350" y2="105" stroke="#475569" marker-end="url(#arrow)"/>
  <rect x="250" y="105" width="200" height="40" fill="#fef3c7" stroke="#d97706" rx="6"/>
  <text x="350" y="130" text-anchor="middle">Route POST /products</text>
  <line x1="350" y1="145" x2="350" y2="170" stroke="#475569" marker-end="url(#arrow)"/>
  <rect x="250" y="170" width="200" height="40" fill="#fef3c7" stroke="#d97706" rx="6"/>
  <text x="350" y="195" text-anchor="middle">Middleware auth + admin</text>
  <line x1="350" y1="210" x2="350" y2="235" stroke="#475569" marker-end="url(#arrow)"/>
  <rect x="230" y="235" width="240" height="40" fill="#dcfce7" stroke="#16a34a" rx="6"/>
  <text x="350" y="260" text-anchor="middle">ProductController@store</text>
  <line x1="350" y1="275" x2="350" y2="300" stroke="#475569" marker-end="url(#arrow)"/>
  <rect x="230" y="300" width="240" height="40" fill="#dcfce7" stroke="#16a34a" rx="6"/>
  <text x="350" y="325" text-anchor="middle">Validasi ($request->validate)</text>
  <line x1="350" y1="340" x2="350" y2="365" stroke="#475569" marker-end="url(#arrow)"/>
  <rect x="230" y="365" width="240" height="40" fill="#fce7f3" stroke="#db2777" rx="6"/>
  <text x="350" y="390" text-anchor="middle">Product::create (Eloquent ORM)</text>
  <line x1="350" y1="405" x2="350" y2="430" stroke="#475569" marker-end="url(#arrow)"/>
  <rect x="230" y="430" width="240" height="40" fill="#fce7f3" stroke="#db2777" rx="6"/>
  <text x="350" y="455" text-anchor="middle">MySQL INSERT (parameterized)</text>
  <line x1="350" y1="470" x2="350" y2="490" stroke="#475569" marker-end="url(#arrow)"/>
  <rect x="250" y="490" width="200" height="26" fill="#dbeafe" stroke="#2563eb" rx="20"/>
  <text x="350" y="508" text-anchor="middle">Redirect + View (Blade)</text>
</svg>